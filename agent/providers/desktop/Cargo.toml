[package]
name = "tether-desktop-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tether-core = { path = "../../tether-core" }

[target.'cfg(windows)'.dependencies]
# uiautomation 0.25.1 imports its input module from core even with defaults disabled.
# We enable the upstream compile dependency, but Tetherplane's semantic backend imports/calls no
# physical input or clipboard APIs; tests/windows_uia.rs enforces that boundary.
uiautomation = { version = "0.25.1", default-features = false, features = ["pattern", "input"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
