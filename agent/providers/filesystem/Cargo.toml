publish = false

[dependencies]
async-trait = "0.1"
cap-std = "4.0.3"
serde_json = "1"
tether-core = { path = "../../tether-core" }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
