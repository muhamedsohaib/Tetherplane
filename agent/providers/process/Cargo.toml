[package]
name = "tether-process-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
serde_json = "1"
portable-pty = "0.9"
sysinfo = "0.39"
tether-core = { path = "../../tether-core" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[features]
# Non-default fixture support: compiles the test-only isolated launcher and
# authorizer used by this crate's own test targets (see dev-dependencies).
# Production builds, release, and packaging never enable it.
test-support = []

[dev-dependencies]
tempfile = "3"
tether-process-provider = { path = ".", features = ["test-support"] }

[lints]
workspace = true
