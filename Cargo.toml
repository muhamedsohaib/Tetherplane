[workspace]
resolver = "2"
members = [
  "agent/tether-core",
  "agent/providers/filesystem",
  "agent/providers/search",
  "agent/providers/process",
  "agent/providers/browser",
  "agent/providers/desktop",
  "agent/tetherd",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
