name: Leno post-reboot read-only evidence (nonrelease)

on:
  pull_request:
    paths:
      - '.github/workflows/leno-postreboot-readonly.yml'
      - 'scripts/msix-store/Assess-Leno-PostReboot-ReadOnly.ps1'
      - 'tests/release/leno-postreboot-readonly.test.ps1'

permissions:
  contents: read

jobs:
  synthetic-windows:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/leno-postreboot-diagnostic-') }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell 5.1 and reject mutation primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('scripts\msix-store\Assess-Leno-PostReboot-ReadOnly.ps1','tests\release\leno-postreboot-readonly.test.ps1')
          foreach ($path in $files) {
            $file = Join-Path $env:GITHUB_WORKSPACE $path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw 'LENOREBOOT_PS51_PARSE_FAILED' }
          }
          $source = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $files[0]))
          foreach ($name in @('Start-ScheduledTask','Register-ScheduledTask','Unregister-ScheduledTask','Stop-Process','Start-Process','Restart-Service','Stop-Service','Start-Service','Remove-Item','Set-ItemProperty','Set-Acl','Add-AppxPackage','Import-Certificate','Invoke-WebRequest','Invoke-RestMethod','Invoke-Expression','Get-Content','Set-Content','Out-File','Write-Host','Set-ExecutionPolicy')) {
            if ($source -match [regex]::Escape($name)) { throw 'LENOREBOOT_UNSAFE_COMMAND_IN_READONLY_SOURCE' }
          }
          Write-Output 'LENOREBOOT_STATIC_READONLY_PASS'
      - name: Exercise four synthetic cases under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $target = Join-Path $env:GITHUB_WORKSPACE 'tests\release\leno-postreboot-readonly.test.ps1'
          $out = & $ps51 -NoProfile -NonInteractive -File $target
          if ($LASTEXITCODE -ne 0 -or ($out -join ' ') -notmatch 'LENOREBOOT_SYNTHETIC_PASS') {
            throw 'LENOREBOOT_SYNTHETIC_TEST_FAILED'
          }
          Write-Output 'LENOREBOOT_WINDOWS_SYNTHETIC_PASS: not Leno or real-world acceptance'
