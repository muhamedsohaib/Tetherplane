name: Phase 1 client profile and evidence contract (NO RELEASE)

on:
  pull_request:
    paths:
      - 'scripts/release/phase1-client-profile.mjs'
      - 'scripts/release/check-phase1-evidence.mjs'
      - 'tests/release/phase1-client-profile.test.mjs'
      - 'tests/release/check-phase1-evidence.test.mjs'
      - '.github/workflows/phase1-client-contract.yml'
  push:
    branches:
      - 'feature/three-channel-release-matrix-phase1-20261020'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Node syntax checks
        run: |
          node --check scripts/release/phase1-client-profile.mjs
          node --check scripts/release/check-phase1-evidence.mjs
      - name: Profile and evidence negative tests
        run: node --test tests/release/phase1-client-profile.test.mjs tests/release/check-phase1-evidence.test.mjs
      - name: Boundary notice
        run: echo 'Contract CI is synthetic only; it does NOT prove a real client, new-machine onboarding, signed Windows binary, OAuth or release readiness.'
