name: Vaulter relay restart settings contract
on:
  push:
    paths:
      - ".github/workflows/vaulter-relay-restart-contract.yml"
      - "scripts/vaulter-relay-restart-settings-repair.ps1"
      - "tests/release/vaulter-relay-restart-settings-contract.ps1"
  pull_request:
    paths:
      - ".github/workflows/vaulter-relay-restart-contract.yml"
      - "scripts/vaulter-relay-restart-settings-repair.ps1"
      - "tests/release/vaulter-relay-restart-settings-contract.ps1"
jobs:
  safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/release/vaulter-relay-restart-settings-contract.ps1
      - name: Test in PowerShell 7
        shell: pwsh
        run: ./tests/release/vaulter-relay-restart-settings-contract.ps1
