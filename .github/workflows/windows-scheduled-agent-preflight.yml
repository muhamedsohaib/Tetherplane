name: Windows scheduled-agent preflight (nonrelease)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-scheduled-agent-preflight.yml'
      - 'scripts/install-windows.ps1'
      - 'tests/release/windows-scheduled-agent-preflight.test.ps1'
      - 'tests/release/windows-package-smoke.ps1'

permissions:
  contents: read

jobs:
  isolated-synthetic-windows:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/windows-scheduled-agent-preflight-') }}
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse and run fail-before-install checks in Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts\install-windows.ps1',
            'tests\release\windows-scheduled-agent-preflight.test.ps1',
            'tests\release\windows-package-smoke.ps1'
          )
          foreach ($path in $files) {
            $source = Join-Path $env:GITHUB_WORKSPACE $path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw 'WINDOWS_SCHEDULED_PREFLIGHT_SOURCE_PARSE_FAIL' }
          }
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\release\windows-scheduled-agent-preflight.test.ps1'
          $output = & $ps51 -NoProfile -NonInteractive -File $script
          if ($LASTEXITCODE -ne 0 -or ($output -join ' ') -notmatch 'WINDOWS_AGENT_PREFLIGHT_TEST_PASS') {
            throw 'WINDOWS_SCHEDULED_PREFLIGHT_TEST_FAILED'
          }
          $unexpected = Get-ScheduledTask -TaskName 'Tetherplane Agent' -ErrorAction SilentlyContinue
          if ($unexpected) { throw 'WINDOWS_SCHEDULED_PREFLIGHT_CREATED_A_TASK' }
          Write-Output 'WINDOWS_SCHEDULED_PREFLIGHT_TEST_PASS: no task or policy modifications'
