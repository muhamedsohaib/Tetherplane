name: Store asset intake preflight (nonrelease)

# Only checks synthetic inputs on disposable runners. Never captures the
# operator's desktop, uploads art or packages, signs, or contacts Partner Center.
on:
  pull_request:
    paths:
      - '.github/workflows/msix-store-artwork-preflight.yml'
      - 'scripts/msix-store/Prepare-StoreArtwork.ps1'
      - 'scripts/msix-store/verify-store-listing-assets.mjs'
      - 'tests/release/msix-store-artwork-preflight.test.mjs'
      - 'docs/release/MSIX_STORE_ASSET_INTAKE_20261030.md'
      - 'docs/release/MSIX_STORE_LISTING_DRAFT_20261030.md'

permissions:
  contents: read

jobs:
  source-contract:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/msix-store-artwork-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify owner-approval denial and screenshot limits using synthetic bytes
        run: node --test tests/release/msix-store-artwork-preflight.test.mjs

  windows-synthetic-asset-export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/msix-store-artwork-') }}
    runs-on: windows-latest
    needs: source-contract
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Export only synthetic transparent icon fixture and verify hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('store-artwork-ci-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($root)
          try {
            Add-Type -AssemblyName System.Drawing
            $source = Join-Path $root 'SYNTHETIC_CI_FIXTURE_NOT_BRANDING.png'
            $bmp = [Drawing.Bitmap]::new(800, 800, [Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [Drawing.Graphics]::FromImage($bmp)
            try {
              $g.Clear([Drawing.Color]::Transparent)
              $brush = [Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(255, 200, 10, 10))
              try { $g.FillRectangle($brush, 180, 180, 440, 440) }
              finally { $brush.Dispose() }
              $bmp.Save($source, [Drawing.Imaging.ImageFormat]::Png)
            } finally { $g.Dispose(); $bmp.Dispose() }
            $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            $out = Join-Path $root 'mechanical-unapproved'
            $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            & $ps51 -NoProfile -NonInteractive -File 'scripts/msix-store/Prepare-StoreArtwork.ps1' -SourceEmblem $source -ExpectedSourceSha256 $hash -OutputDirectory $out
            if ($LASTEXITCODE -ne 0) { throw 'STORE_ARTWORK_WINDOWS_EXPORT_FAILED' }
            node scripts/msix-store/verify-store-listing-assets.mjs --source $source --assets-dir $out --evidence (Join-Path $out 'asset-evidence.UNAPPROVED.json')
            if ($LASTEXITCODE -ne 0) { throw 'STORE_ARTWORK_WINDOWS_VALIDATION_FAILED' }
            & $ps51 -NoProfile -NonInteractive -File 'scripts/msix-store/Prepare-StoreArtwork.ps1' -SourceEmblem $source -ExpectedSourceSha256 $hash -OutputDirectory $out 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw 'STORE_ARTWORK_REPLACE_EXISTING_MUST_FAIL' }
            Write-Output 'STORE_ARTWORK_SYNTHETIC_EXPORT_AND_NO_OVERWRITE_PASS_NOT_APPROVED'
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
