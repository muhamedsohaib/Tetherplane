name: Release

# Public Windows publication is disabled until a signed-candidate promotion
# workflow has independent source, signature, and new-device acceptance proof.
# This legacy tag hook must not build, upload, or publish unsigned binaries.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Block unsigned Windows public release
        shell: pwsh
        run: |
          throw 'UNSIGNED_PUBLIC_RELEASE_BLOCKED: no approved signed candidate or independently verified promotion gate exists'
