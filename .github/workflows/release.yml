name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          pnpm -r typecheck
          pnpm -r test
          pnpm -r build
          python scripts/check-no-unsafe.py

      - name: Build Windows package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -OutputPath dist/Tetherplane-Windows-x64
          ./tests/release/windows-package-smoke.ps1

      - name: Create archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Tetherplane-Windows-x64/* -DestinationPath Tetherplane-Windows-x64.zip -Force
          $hash = (Get-FileHash Tetherplane-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tetherplane-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Tetherplane-Windows-x64
          path: |
            Tetherplane-Windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Tetherplane-Windows-x64.zip SHA256SUMS.txt --generate-notes
