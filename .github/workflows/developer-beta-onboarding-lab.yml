name: Developer Beta Add Device Lab (review-only ZIP)

on:
  push:
    branches:
      - feature/developer-beta-one-click-onboarding-20261107
      - fix/developer-beta-browser-payload-20261109
      - feature/developer-beta-single-zip-three-steps-20261109
      - chore/review-beta-zip-attestation-20261115
    paths:
      - '.github/workflows/developer-beta-onboarding-lab.yml'
      - 'packaging/developer-beta/**'
      - 'scripts/developer-beta/**'
      - 'tests/release/developer-beta-add-device.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/developer-beta-onboarding-lab.yml'
      - 'packaging/developer-beta/**'
      - 'scripts/developer-beta/**'
      - 'tests/release/developer-beta-add-device.test.mjs'
  workflow_dispatch:
    inputs:
      public_relay_url:
        description: "Optional existing public wss:// relay /device URL (never put secrets here)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-developer-beta:
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      review_zip_sha256: ${{ steps.build_review_zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify onboarding contract and existing Store pairing semantics
        shell: pwsh
        run: |
          node --test tests/release/developer-beta-add-device.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DEVELOPER_BETA_PAIRING_TESTS_FAIL' }
          node --test tests/release/msix-store-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'EXISTING_STORE_AUTH_REGRESSION_FAIL' }

      - name: Build exact source native windowless agent and setup launcher
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'RUST_TOOLCHAIN_INSTALL_FAIL' }
          .\scripts\build-windows-agent-binaries.ps1
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_BINARY_BUILD_FAIL' }

      - name: Build reviewed browser runtime and extension (not enrolled)
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'BETA_COREPACK_ENABLE_FAILED' }
          corepack prepare pnpm@10 --activate
          if ($LASTEXITCODE -ne 0) { throw 'BETA_PNPM_ENABLE_FAILED' }
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'BETA_WORKSPACE_INSTALL_FAILED' }
          pnpm.cmd --filter @tetherplane/browser-bridge build
          if ($LASTEXITCODE -ne 0) { throw 'BETA_BROWSER_BRIDGE_BUILD_FAILED' }
          pnpm.cmd --filter @tetherplane/browser-extension build
          if ($LASTEXITCODE -ne 0) { throw 'BETA_BROWSER_EXTENSION_BUILD_FAILED' }

      - name: Download matching public Node license only
        shell: pwsh
        run: |
          $version = (& node -p 'process.version').Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^v24\.[0-9]+\.[0-9]+$') { throw 'NODE_VERSION_UNEXPECTED' }
          $url = "https://raw.githubusercontent.com/nodejs/node/$version/LICENSE"
          $file = Join-Path $env:RUNNER_TEMP 'node-distribution-LICENSE'
          Invoke-WebRequest -Uri $url -OutFile $file -MaximumRedirection 2 -TimeoutSec 45
          if ((Get-Item -LiteralPath $file).Length -lt 1000) { throw 'NODE_LICENSE_MISSING' }
          "TETHERPLANE_NODE_LICENSE_PATH=$file" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build non-installed, checksum-verified owner-approved ZIP
        id: build_review_zip
        shell: pwsh
        env:
          TETHERPLANE_PUBLIC_RELAY_URL: ${{ inputs.public_relay_url }}
        run: |
          $parent = Join-Path $env:GITHUB_WORKSPACE 'target\developer-beta'
          New-Item -ItemType Directory -Path $parent -ErrorAction Stop | Out-Null
          $short = (git rev-parse --short=12 HEAD).Trim()
          $name = "Tetherplane-DeveloperBeta-Windows-x64-$short"
          $folder = Join-Path $parent $name
          .\scripts\developer-beta\Build-DeveloperBeta.ps1 -OutputPath $folder -NodeLicenseFile $env:TETHERPLANE_NODE_LICENSE_PATH -PublicRelayUrl $env:TETHERPLANE_PUBLIC_RELAY_URL
          if ($LASTEXITCODE -ne 0) { throw 'DEVELOPER_BETA_BUILD_FAILED' }
          $archive = Join-Path $parent ($name + '.zip')
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $archive -CompressionLevel Optimal
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'DEVELOPER_BETA_ZIP_FAILED' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "DEVELOPER_BETA_REVIEW_ZIP_SHA256=$hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "DEVELOPER_BETA_REVIEW_COMMIT=$((git rev-parse HEAD).Trim())"
          "TETHERPLANE_REVIEW_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify one extraction and the included Notepad instructions
        shell: pwsh
        run: |
          $archive = $env:TETHERPLANE_REVIEW_ZIP
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'BETA_ARCHIVE_MISSING' }
          $extracted = Join-Path $env:RUNNER_TEMP ('tetherplane-extract-'+[guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $extracted) { throw 'BETA_EXTRACT_COLLISION' }
          try {
            Expand-Archive -LiteralPath $archive -DestinationPath $extracted -ErrorAction Stop
            $guide = Join-Path $extracted 'READ ME FIRST.txt'
            if (-not (Test-Path -LiteralPath $guide -PathType Leaf)) { throw 'BETA_NOTEPAD_MISSING' }
            if (-not (Test-Path -LiteralPath (Join-Path $extracted 'START HERE.cmd') -PathType Leaf)) { throw 'BETA_LAUNCHER_MISSING' }
            $txt = Get-Content -LiteralPath $guide -Raw
            $steps = @([regex]::Matches($txt,'(?m)^([1-3])\. '))
            if ($steps.Count -ne 3) { throw 'BETA_NOTEPAD_NOT_THREE_STEPS' }
            $node = Join-Path $extracted 'runtime\node.exe'
            $preflight = Join-Path $extracted 'app\preflight.mjs'
            & $node $preflight --check
            if ($LASTEXITCODE -ne 0) { throw 'BETA_EXTRACTED_PACKAGE_INTEGRITY_FAILED' }
            Write-Output 'BETA_ONE_EXTRACT_THREE_STEPS_PASS'
          }
          finally {
            if (Test-Path -LiteralPath $extracted) {
              Remove-Item -LiteralPath $extracted -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Retain review artifact only, not a release or installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tetherplane-developer-beta-review-only
          path: ${{ env.TETHERPLANE_REVIEW_ZIP }}
          if-no-files-found: error
          retention-days: 7

  # Attestation only: review artifact is unsigned, not approved for public release.
  # Isolate OIDC and attestation write permissions from fork/PR build jobs.
  attest-developer-beta-review-zip:
    name: Attest review-only ZIP provenance (NOT a public release)
    if: github.event_name != 'pull_request' && github.repository == 'muhamedsohaib/Tetherplane'
    needs: windows-developer-beta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the exact ZIP from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tetherplane-developer-beta-review-only
          path: review-zip

      - name: Cross-check archive checksum, source commit, and unsigned status
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.windows-developer-beta.outputs.review_zip_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(review-zip/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then echo 'REVIEW_ZIP_COUNT_MISMATCH'; exit 1; fi
          if ! [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]; then echo 'REVIEW_ZIP_EXPECTED_SHA_INVALID'; exit 1; fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "${archives[0]}" | sha256sum --check --status
          unzip -p "${archives[0]}" developer-beta.json | jq -e --arg head "$GITHUB_SHA" '(.source_commit == $head) and (.tetherplane_product_signed == false) and (.explicit_owner_pairing_required == true) and (.no_automatic_startup_task == true)' > /dev/null
          echo 'REVIEW_ZIP_SOURCE_HASH_AND_UNSIGNED_STATUS_VERIFIED'

      - name: Create signed provenance attestation for review ZIP only
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: review-zip/*.zip
