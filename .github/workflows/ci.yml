name: CI

on:
  push:
  pull_request:

jobs:
  control-center:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack and pnpm
        run: corepack enable
      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Portal typecheck
        run: pnpm --filter @tetherplane/control-center typecheck
      - name: Portal HTTP and security tests
        run: pnpm --filter @tetherplane/control-center test
      - name: Portal build
        run: pnpm --filter @tetherplane/control-center build
      - name: Install isolated test browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: pnpm --filter @tetherplane/control-center exec playwright install --with-deps chromium --only-shell
      - name: Portal browser acceptance
        run: pnpm --filter @tetherplane/control-center test:browser

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p tetherd

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1
