name: CI

on:
  push:
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enforce fail-closed public release policy
        run: node --test tests/release/windows-main-publication-block.test.mjs

      - name: Test read-only Windows candidate byte evidence
        run: node --test tests/release/windows-candidate-digests.test.mjs

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Reject foreign -Force install prefix (disposable Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-install-prefix-ownership.ps1

      - name: Reject foreign uninstaller task ownership (disposable Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-uninstall-task-ownership.ps1

      - name: Preserve unrelated model-worker autorun entries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-uninstall-isolation.ps1

      - name: Reject state purge before destructive uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-uninstall-state-preflight.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect disposable Store agent-state ACLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p tetherd --bin tetherd --locked
          if ($LASTEXITCODE -ne 0) { throw 'DISPOSABLE_ACL_AGENT_BUILD_FAILED' }
          node --test tests/release/msix-store-agent-state-acl.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'DISPOSABLE_ACL_TEST_FAILED' }

      - name: Test Windows candidate byte evidence on Node 22
        if: runner.os == 'Windows'
        run: node --test tests/release/windows-candidate-digests.test.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: No legacy browser PowerShell autorun contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/authenticated-browser-windows-install-contract.ps1

      - name: Windows release binaries (stdio and windowless agent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-agent-binaries.ps1

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1
