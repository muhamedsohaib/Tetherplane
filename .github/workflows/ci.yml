name: CI

on:
  push:
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enforce fail-closed public release policy
        run: node --test tests/release/windows-main-publication-block.test.mjs

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: Browser semantic context regression
        run: node --test tests/release/browser-semantic-context.test.mjs

      - name: TypeScript builds
        run: pnpm -r build

      - name: Owner Portal actual Chromium grant/revoke and mobile-layout acceptance
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p tetherd
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node --test tests/e2e/portal-control.test.ts

      - name: Actual isolated staging rehearsal (G4 and physical G6 excluded)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p tetherd
          node --test tests/release/staging-acceptance.test.mjs
          # The ordinary branded Chrome no longer supports CLI unpacked-extension
          # loading. Use the official testing flavor, isolated in RUNNER_TEMP.
          chrome_dir="$RUNNER_TEMP/tetherplane-chrome-for-testing"
          mkdir -p "$chrome_dir"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 --retry 2 \
            https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            -o "$chrome_dir/availability.json"
          chrome_version="$(python3 -c 'import json,re,sys; d=json.load(open(sys.argv[1])); v=d["channels"]["Stable"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+",v); assert any(x["platform"]=="linux64" and x["url"]=="https://storage.googleapis.com/chrome-for-testing-public/"+v+"/linux64/chrome-linux64.zip" for x in d["channels"]["Stable"]["downloads"]["chrome"]); print(v)' "$chrome_dir/availability.json")"
          curl --fail --silent --show-error --location --proto '=https' --max-time 180 --retry 2 \
            "https://storage.googleapis.com/chrome-for-testing-public/$chrome_version/linux64/chrome-linux64.zip" \
            -o "$chrome_dir/chrome.zip"
          unzip -q "$chrome_dir/chrome.zip" -d "$chrome_dir"
          export TETHERPLANE_CHROMIUM="$chrome_dir/chrome-linux64/chrome"
          export TETHERPLANE_STAGING_CHROME_VERSION="$chrome_version"
          test -x "$TETHERPLANE_CHROMIUM"
          "$TETHERPLANE_CHROMIUM" --version
          sha256sum "$TETHERPLANE_CHROMIUM"
          node scripts/staging-acceptance.mjs --mode auto --allow-partial --report-file "$RUNNER_TEMP/tetherplane-staging-report.json" > "$RUNNER_TEMP/tetherplane-staging.log"
          node scripts/verify-staging-ci-evidence.mjs "$RUNNER_TEMP/tetherplane-staging-report.json" "$RUNNER_TEMP/tetherplane-staging-evidence.json"

      - name: Retain sanitized exact-candidate staging evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-rehearsal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tetherplane-staging-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p tetherd

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1
