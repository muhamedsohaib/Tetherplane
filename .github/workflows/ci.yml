name: CI

on:
  push:
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enforce fail-closed public release policy
        run: node --test tests/release/windows-main-publication-block.test.mjs

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Process lifecycle measurements
        run: cargo test -p tether-process-provider lifecycle_tests -- --nocapture

      - name: Bounded process endurance soak
        env:
          TETHERPLANE_PHASE4_SOAK_SECONDS: '60'
        run: cargo test -p tether-process-provider configured_128_session_ceiling_endurance_samples_resource_trends -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10.34.5 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p tetherd

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1

      - name: Windows V5 Control Center ACL hardening and rollback rehearsal
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/v5-control-center-acl-isolated-rehearsal.ps1

      - name: VAULTER V5 ACL prepare/apply script self-test (synthetic only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./docs/release/VAULTER_V5_ACL_SAFE_HARDENING_20261031_v3.ps1 -Mode SelfTest

      - name: Windows canary verifier negative contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/canary-verifier-fail-closed.ps1
