name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Process lifecycle measurements
        run: cargo test -p tether-process-provider lifecycle_tests -- --nocapture

      - name: Bounded process endurance soak
        env:
          TETHERPLANE_PHASE4_SOAK_SECONDS: '60'
        run: cargo test -p tether-process-provider configured_128_session_ceiling_endurance_samples_resource_trends -- --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10.34.5 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Owner authority metadata-only verifier contract
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/diagnostics/verify-owner-management-identity-readonly.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'Owner metadata-only verifier must parse with Windows PowerShell 5.1' }
          $work = Join-Path $env:RUNNER_TEMP 'owner-verifier-contract'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $stateFile = Join-Path $work 'state.json'
          $configFile = Join-Path $work 'owner.json'
          Set-Content -LiteralPath $stateFile -Encoding UTF8 -Value '{"version":1,"revision":0,"enabled":false,"grants":[]}'
          $cfg = @{ owner = @{ accountId = 'synthetic-account'; clientId = 'synthetic-owner-client'; principalId = 'human:synthetic' }; stateFile = $stateFile } | ConvertTo-Json -Depth 3
          Set-Content -LiteralPath $configFile -Encoding UTF8 -Value $cfg
          $receipt = @(./scripts/diagnostics/verify-owner-management-identity-readonly.ps1 -ExpectedExistingOwnerClientId 'synthetic-owner-client' -AuthorityConfigPath $configFile)
          if ($receipt -notcontains 'OWNER_CONFIG_EXISTS=True') { throw 'Existing owner config presence not detected' }
          if ($receipt -notcontains 'OWNER_CLIENT_MATCHES_RECORDED_EXISTING_ID=True') { throw 'Existing owner client match not detected' }
          if ($receipt -notcontains 'OWNER_ACCOUNT_AND_PRINCIPAL_CONFIGURED=True') { throw 'Owner identity metadata not detected' }
          if ($receipt -notcontains 'ENFORCEMENT_STATE=DISABLED') { throw 'Disabled synthetic grant state not detected' }
          if ($receipt -notcontains 'OWNER_GRANT_COUNT=0') { throw 'Empty synthetic grants not detected' }
          if (($receipt -join ' ') -match 'synthetic-owner-client|human:synthetic|synthetic-account') { throw 'Owner verifier leaked identity fields in receipt' }
          Write-Output 'OWNER_READONLY_RECEIPT_CONTRACT=PASS'

      - name: Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p tetherd

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1

      - name: Windows canary verifier negative contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/canary-verifier-fail-closed.ps1
