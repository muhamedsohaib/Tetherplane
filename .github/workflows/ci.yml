name: CI

on:
  push:
  pull_request:

jobs:
  release-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enforce fail-closed public release policy
        run: node --test tests/release/windows-main-publication-block.test.mjs

      - name: Verify Windows portable runtime source contracts
        run: node --test tests/release/windows-portable-runtime.test.mjs

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Windows release binary
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --locked --release -p tetherd

      - name: Reject non-portable MSVC runtime dependencies
        if: runner.os == 'Windows'
        run: node scripts/windows/check-pe-runtime-imports.mjs target/release/tetherd.exe

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1
