name: CI

on:
  push:
  pull_request:

jobs:
  starter-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Repository hygiene and high-confidence secret scan
        run: python scripts/check_repo_hygiene.py
      - name: Skill safety and package contract tests
        run: python -m unittest discover -s tests/skills -p "test_*.py"
      - name: Package checked starter ZIP
        run: python scripts/package_starter_skill.py --output dist/agensi/tetherplane-starter.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned OpenCode v2 host
        run: npm install --global --no-audit --no-fund @opencode/cli@2.0.30
      - name: Discover packaged skill in isolated OpenCode host
        run: python tests/skills/opencode_host_acceptance.py dist/agensi/tetherplane-starter.zip
      - name: Record verified starter artifact provenance
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, shutil, zlib
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("dist/agensi")
          package = root / "tetherplane-starter-0.1.0.zip"
          shutil.copyfile(root / "tetherplane-starter.zip", package)
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          (root / (package.name + ".sha256")).write_text(digest + "  " + package.name + "\n", encoding="utf-8")
          with ZipFile(package) as archive:
              members = [{"path": member.filename, "bytes": member.file_size, "sha256": hashlib.sha256(archive.read(member)).hexdigest()} for member in archive.infolist()]
          manifest = {"member_count": len(members), "members": members, "package": "tetherplane-starter", "version": "0.1.0", "source_commit": os.environ["CANDIDATE_SHA"], "filename": package.name, "bytes": package.stat().st_size, "sha256": digest, "python": platform.python_version(), "zlib": zlib.ZLIB_RUNTIME_VERSION, "host_discovery": "OpenCode 2.0.30; exact archive bytes copied after successful discovery; model invocation not tested"}
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tetherplane-starter-0.1.0
          path: |
            dist/agensi/tetherplane-starter-0.1.0.zip
            dist/agensi/tetherplane-starter-0.1.0.zip.sha256
            dist/agensi/manifest.json
          if-no-files-found: error
          retention-days: 30


  starter-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p tetherd
      - run: pnpm --filter @tetherplane/e2e build:deps
      - name: Read-only starter MCP integration
        run: node --test tests/e2e/tetherplane-starter.test.ts

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm 10
        run: corepack prepare pnpm@10 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm -r typecheck

      - name: TypeScript tests
        run: pnpm -r test

      - name: TypeScript builds
        run: pnpm -r build

      - name: Relay production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.relay --tag tetherplane-relay:ci .

      - name: Auth production container
        if: runner.os == 'Linux'
        run: docker build --file Dockerfile.auth --tag tetherplane-auth:ci .

      - name: Authored unsafe scan
        run: python scripts/check-no-unsafe.py

      - name: Windows release binary
        if: runner.os == 'Windows'
        run: cargo build --release -p tetherd

      - name: Windows package/install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/windows-package-smoke.ps1
