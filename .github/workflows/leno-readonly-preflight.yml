name: Leno read-only preflight (nonrelease)

on:
  pull_request:
    paths:
      - ".github/workflows/leno-readonly-preflight.yml"
      - "scripts/msix-store/Inspect-Leno-ReadOnly.ps1"
      - "scripts/msix-store/Inspect-Leno-Connectivity-ReadOnly.ps1"
      - "scripts/msix-store/Inspect-Leno-Canary-Boundary-ReadOnly.ps1"
      - "scripts/msix-store/Inspect-Leno-Agent-Route-ReadOnly.ps1"

permissions:
  contents: read

jobs:
  windows-readonly:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/leno-readonly-preflight-') }}
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse on Windows PowerShell 5.1 and enforce read-only contract
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-ReadOnly.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -gt 0) { throw 'LENOPREFLIGHT_PS51_PARSE_FAIL' }
          $text = [IO.File]::ReadAllText($source)
          $forbidden = @(
            'Set-Service', 'Start-Service', 'Stop-Service', 'Restart-Service',
            'Start-ScheduledTask', 'Register-ScheduledTask', 'Unregister-ScheduledTask',
            'New-LocalUser', 'Set-MpPreference', 'Add-AppxPackage', 'Remove-AppxPackage',
            'Import-Certificate', 'Set-ExecutionPolicy', 'ExecutionPolicy Bypass',
            'Invoke-WebRequest', 'Invoke-RestMethod', 'Invoke-Expression',
            'Start-Process', 'Remove-Item', 'New-Item', 'Set-Acl', 'Set-ItemProperty'
          )
          foreach ($name in $forbidden) {
            if ($text -match [regex]::Escape($name)) { throw 'LENOPREFLIGHT_UNSAFE_COMMAND_FOUND' }
          }
          $followup = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-Connectivity-ReadOnly.ps1'
          $followupErrors = $null
          $followupTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($followup, [ref]$followupTokens, [ref]$followupErrors)
          if (@($followupErrors).Count -gt 0) { throw 'LENOFOLLOWUP_PS51_PARSE_FAIL' }
          $followupText = [IO.File]::ReadAllText($followup)
          foreach ($name in $forbidden) {
            if ($followupText -match [regex]::Escape($name)) { throw 'LENOFOLLOWUP_UNSAFE_COMMAND_FOUND' }
          }
          Write-Output 'LENOPREFLIGHT_PS51_SYNTAX_AND_READONLY_CONTRACT_PASS'
      - name: Execute exact diagnostics in disposable Windows runner
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-ReadOnly.ps1'
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $output = & $ps51 -NoProfile -NonInteractive -File $script
          if ($LASTEXITCODE -ne 0) { throw 'LENOPREFLIGHT_PS51_RUN_FAILED' }
          $report = ($output | Out-String).Trim() | ConvertFrom-Json -ErrorAction Stop
          if ($report.schema -ne 'tetherplane-leno-readonly-preflight-v1') {
            throw 'LENOPREFLIGHT_SCHEMA_MISMATCH'
          }
          if ($report.note -notmatch 'Diagnostic only') {
            throw 'LENOPREFLIGHT_SCOPE_MISMATCH'
          }
          if ($null -eq $report.tetherplane_tasks -or $null -eq $report.agent_processes) {
            throw 'LENOPREFLIGHT_MISSING_FIELDS'
          }
          $followup = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-Connectivity-ReadOnly.ps1'
          $second = & $ps51 -NoProfile -NonInteractive -File $followup
          if ($LASTEXITCODE -ne 0) { throw 'LENOFOLLOWUP_PS51_RUN_FAILED' }
          $snapshot = ($second | Out-String).Trim() | ConvertFrom-Json -ErrorAction Stop
          if ($snapshot.schema -ne 'tetherplane-leno-connectivity-readonly-v1' -or
              @($snapshot.task_runs).Count -ne 2 -or
              $snapshot.caveat -notmatch 'not authenticated MCP') {
            throw 'LENOFOLLOWUP_SCHEMA_SCOPE_FAIL'
          }
          Write-Output 'LENOFOLLOWUP_PS51_RUN_PASS: isolated Windows CI runner, NOT Leno'
          Write-Output 'LENOPREFLIGHT_PS51_RUN_PASS: synthetic GitHub-hosted Windows runner, NOT Leno'

      - name: Independently validate canary and socket-boundary diagnostics
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-Canary-Boundary-ReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'LENOCANARY_PS51_PARSE_FAIL' }
          $source = [IO.File]::ReadAllText($script)
          $forbidden = @(
            'Set-Service', 'Start-Service', 'Stop-Service', 'Restart-Service',
            'Start-ScheduledTask', 'Register-ScheduledTask', 'Unregister-ScheduledTask',
            'New-LocalUser', 'Set-MpPreference', 'Add-AppxPackage', 'Remove-AppxPackage',
            'Set-ExecutionPolicy', 'ExecutionPolicy Bypass',
            'Invoke-WebRequest', 'Invoke-RestMethod', 'Invoke-Expression',
            'Start-Process', 'Remove-Item', 'New-Item', 'Set-Acl', 'Set-ItemProperty'
          )
          foreach ($name in $forbidden) {
            if ($source -match [regex]::Escape($name)) { throw 'LENOCANARY_MUTATION_FOUND' }
          }
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $output = & $ps51 -NoProfile -NonInteractive -File $script
          if ($LASTEXITCODE -ne 0) { throw 'LENOCANARY_RUN_FAILED' }
          $report = ($output | Out-String).Trim() | ConvertFrom-Json -ErrorAction Stop
          if ($report.schema -ne 'tetherplane-leno-canary-boundary-v1' -or
              $report.note -notmatch 'does not prove authenticated' -or
              $null -eq $report.canary -or
              $null -eq $report.agent_processes -or
              $null -eq $report.canary_task_events -or
              $null -eq $report.recent_tetherd_blocks) {
            throw 'LENOCANARY_SCHEMA_INVALID'
          }
          Write-Output 'LENOCANARY_PS51_READONLY_PASS: disposable CI runner, NOT Leno'

      - name: Validate exact route classifier in Windows PowerShell 5.1
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'scripts\msix-store\Inspect-Leno-Agent-Route-ReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw 'LENOROUTE_PS51_PARSE_FAIL' }
          $text = [IO.File]::ReadAllText($source)
          foreach ($forbidden in @(
            'Start-Service', 'Stop-Service', 'Restart-Service', 'Set-Service',
            'Start-ScheduledTask', 'Register-ScheduledTask', 'Unregister-ScheduledTask',
            'New-LocalUser', 'Set-MpPreference', 'Set-ExecutionPolicy',
            'Start-Process', 'Stop-Process', 'Add-AppxPackage', 'Remove-AppxPackage',
            'Set-Acl', 'Set-ItemProperty', 'Remove-Item', 'New-Item',
            'Invoke-Expression', 'Invoke-WebRequest', 'Invoke-RestMethod'
          )) {
            if ($text -match [regex]::Escape($forbidden)) {
              throw 'LENOROUTE_MUTATING_COMMAND_FOUND'
            }
          }
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $out = & $ps51 -NoProfile -NonInteractive -File $source
          if ($LASTEXITCODE -ne 0) { throw 'LENOROUTE_PS51_EXECUTION_FAIL' }
          $json = ($out | Out-String).Trim() | ConvertFrom-Json -ErrorAction Stop
          if ($json.schema -ne 'tetherplane-leno-agent-route-v1' -or
              $null -eq $json.agent_processes -or
              $json.note -notmatch 'do not establish successful') {
            throw 'LENOROUTE_SCHEMA_FAIL'
          }
          if ($text -match '(?i)Write-Host|Get-Content|Out-File|Set-Content|Add-Content') {
            throw 'LENOROUTE_SECRET_OR_UNREVIEWED_OUTPUT'
          }
          Write-Output 'LENOROUTE_PS51_READONLY_PASS: disposable Windows CI runner, NOT Leno'
