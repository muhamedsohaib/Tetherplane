name: Windows Browser Companion Quarantine (unsigned, nonrelease)

# Strictly scoped, short-lived reproducibility proof. It never installs, signs,
# publishes or changes any owner device. A push to exactly the reviewed draft
# PR branch is required; this workflow does not widen the Store review allowlist.
on:
  push:
    branches:
      - fix/windows-native-crt-static-clean-install-20261102
    paths:
      - '.github/workflows/windows-browser-companion-quarantine.yml'
      - 'scripts/release/windows_browser_companion_candidate.py'
      - 'tests/release/test_windows_browser_companion_candidate.py'
      - 'scripts/build-windows-agent-binaries.ps1'
      - 'agent/tetherd/**'
      - 'browser/**'
      - 'extension/browser/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  windows-candidate:
    if: github.repository == 'muhamedsohaib/Tetherplane' && github.ref == 'refs/heads/fix/windows-native-crt-static-clean-install-20261102'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify source and local deterministic-package tests
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($head -cne $env:GITHUB_SHA -or $head -cnotmatch '^[0-9a-f]{40}$') { throw 'SOURCE_SHA_MISMATCH' }
          python -c "import sys; assert sys.version_info >= (3,10), 'Python 3.10+ required'"
          if ($LASTEXITCODE -ne 0) { throw 'PYTHON_RUNTIME_NOT_AVAILABLE' }
          python -m unittest discover -s tests/release -p test_windows_browser_companion_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'PACKAGE_DETERMINISM_TEST_FAILED' }
          Write-Output ('NATIVE_SOURCE_SHA=' + $head)
          Write-Output ('RUST_VERSION=' + ((& rustc --version) -join ''))
          Write-Output ('PYTHON_VERSION=' + ((& python --version) -join ''))
      - name: Build source-matched dependencies and Windows GUI launchers
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'COREPACK_UNAVAILABLE' }
          corepack prepare pnpm@10.34.5 --activate
          if ($LASTEXITCODE -ne 0) { throw 'PNPM_ACTIVATION_FAILED' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'FROZEN_DEPENDENCIES_FAILED' }
          pnpm -r build
          if ($LASTEXITCODE -ne 0) { throw 'WORKSPACE_BUILD_FAILED' }
          ./scripts/build-windows-agent-binaries.ps1
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_WINDOWS_BUILD_FAILED' }
          node tests/release/windows-native-runtime-imports.mjs target/release
          if ($LASTEXITCODE -ne 0) { throw 'STATIC_CRT_IMPORT_GATE_FAILED' }
      - name: Assemble production browser bridge and host in temporary directory
        shell: pwsh
        run: |
          $bridgeOut = Join-Path $env:RUNNER_TEMP 'browser-companion-deploy\browser-bridge'
          $hostOut = Join-Path $env:RUNNER_TEMP 'browser-companion-deploy\host\host.mjs'
          New-Item -ItemType Directory -Path (Split-Path -Parent $hostOut) -Force | Out-Null
          pnpm --config.node-linker=hoisted --filter @tetherplane/browser-bridge deploy --legacy --prod $bridgeOut
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_BRIDGE_DEPLOY_FAILED' }
          pnpm --filter @tetherplane/browser-extension exec esbuild ../../scripts/browser-extension-host.ts --bundle --platform=node --format=esm --target=node22 --packages=external ("--outfile=" + $hostOut)
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $hostOut -PathType Leaf)) {
            throw 'BROWSER_HOST_BUNDLE_FAILED'
          }
          $nodeExe = (node -p 'process.execPath').Trim()
          if ([string](Get-AuthenticodeSignature -LiteralPath $nodeExe).Status -cne 'Valid') {
            throw 'NODE_EXECUTABLE_MUST_HAVE_VALID_SIGNATURE'
          }
          $license = Join-Path (Split-Path -Parent $nodeExe) 'LICENSE'
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) { throw 'NODE_LICENSE_MISSING' }
          Write-Output 'BROWSER_PACKAGE_DEPENDENCIES_PREPARED_NO_ENROLLMENT'
      - name: Build candidate twice; verify archive bytes are identical
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $nodeExe = (node -p 'process.execPath').Trim()
          $nodeLicense = Join-Path (Split-Path -Parent $nodeExe) 'LICENSE'
          $bridge = Join-Path $env:RUNNER_TEMP 'browser-companion-deploy\browser-bridge'
          $host = Join-Path $env:RUNNER_TEMP 'browser-companion-deploy\host\host.mjs'
          $launcher = Join-Path $repo 'target\release\tetherplane-browserw.exe'
          $extension = Join-Path $repo 'extension\browser'
          $out1 = Join-Path $env:RUNNER_TEMP 'tp-browser-stage-one'
          $out2 = Join-Path $env:RUNNER_TEMP 'tp-browser-stage-two'
          $zip1 = Join-Path $env:RUNNER_TEMP ('tetherplane-browser-companion-UNSIGNED-' + $env:GITHUB_SHA + '.zip')
          $zip2 = Join-Path $env:RUNNER_TEMP 'tetherplane-browser-companion-repeat.zip'
          $args = @('--source-root', $repo, '--source-sha', $env:GITHUB_SHA,
              '--browserw', $launcher, '--node', $nodeExe, '--node-license', $nodeLicense,
              '--host', $host, '--bridge', $bridge, '--extension', $extension)
          & python scripts/release/windows_browser_companion_candidate.py stage @args --out-dir $out1 --archive $zip1
          if ($LASTEXITCODE -ne 0) { throw 'FIRST_STAGING_FAILED' }
          & python scripts/release/windows_browser_companion_candidate.py stage @args --out-dir $out2 --archive $zip2
          if ($LASTEXITCODE -ne 0) { throw 'SECOND_STAGING_FAILED' }
          $hash1 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip1).Hash.ToLowerInvariant()
          $hash2 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip2).Hash.ToLowerInvariant()
          if ($hash1 -cne $hash2) { throw 'NONDETERMINISTIC_ARCHIVE_BYTES' }
          & python scripts/release/windows_browser_companion_candidate.py verify --archive $zip1 --source-sha $env:GITHUB_SHA --expected-sha $hash1
          if ($LASTEXITCODE -ne 0) { throw 'INDEPENDENT_ARCHIVE_BYTE_VERIFICATION_FAILED' }
          $report = [ordered]@{
            schema = 'tetherplane.browser-companion-build-evidence.v1'
            source_sha = $env:GITHUB_SHA
            artifact_sha256 = $hash1
            reproducible_zip_given_same_inputs = $true
            build_toolchain_rustc = ((& rustc --version) -join '').Trim()
            build_toolchain_node = ((& node --version) -join '').Trim()
            signed_msix = $false
            authenticode_for_browser_companion = 'NOT_SIGNED'
            installed_owner_session = 'NOT_RUN'
            browser_grants_and_revocation = 'NOT_RUN'
            release = 'NO_GO'
          }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'browser-companion-evidence.json'),
            ($report | ConvertTo-Json -Depth 4) + "`n", [Text.UTF8Encoding]::new($false))
          Write-Output 'BROWSER_COMPANION_BYTE_REPRODUCIBILITY_OK_UNSIGNED_NO_GO'
      - name: Native browser launcher lifecycle, opt-in and revocation (synthetic only)
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'tp-browser-stage-one'
          & node tests/release/windows-browserw-lifecycle.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWLESS_NATIVE_OWNER_LIFECYCLE_FAILED' }
          & node tests/release/windows-browserw-background-optin-lifecycle.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_BACKGROUND_OPTIN_REVOKE_FAILED' }
          & node tests/release/browser-package-runtime.mjs $stage
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_PACKAGE_RUNTIME_FAILED' }
      - name: Retain unsigned quarantine for one day; never install or release
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-BROWSER-COMPANION-DO-NOT-INSTALL-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tetherplane-browser-companion-UNSIGNED-${{ github.sha }}.zip
            ${{ runner.temp }}/browser-companion-evidence.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  independent-archive-verify:
    needs: windows-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UNSIGNED-BROWSER-COMPANION-DO-NOT-INSTALL-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-browser-review
      - name: Independently verify ZIP, manifest and no-release claims
        env:
          EVIDENCE: ${{ runner.temp }}/unsigned-browser-review
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['EVIDENCE'])
          report = json.loads((root / 'browser-companion-evidence.json').read_text('utf-8'))
          sha = os.environ['GITHUB_SHA']
          assert report['source_sha'] == sha
          assert report['release'] == 'NO_GO'
          assert report['signed_msix'] is False
          archive = root / ('tetherplane-browser-companion-UNSIGNED-' + sha + '.zip')
          subprocess.run(['python3','scripts/release/windows_browser_companion_candidate.py', 'verify',
                          '--archive',str(archive.absolute()), '--source-sha',sha,
                          '--expected-sha',report['artifact_sha256']], check=True)
          print('INDEPENDENT_ARCHIVE_VERIFIED_NOT_SIGNED_NOT_RELEASED')
          PY
