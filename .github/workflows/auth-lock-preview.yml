name: Auth lock preview

on:
  push:
    branches:
      - feature/tether-auth-server-m1

jobs:
  lock-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Print lockfile diff
        run: git diff -- pnpm-lock.yaml
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: auth-generated-lockfile-types
          path: pnpm-lock.yaml
          if-no-files-found: error
