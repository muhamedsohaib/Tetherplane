name: Windows Toast Developer Beta
# Intentionally limited to the draft development branch. No deployment, publication,
# package signing, OAuth configuration or protected branch mutation.
on:
  push:
    branches:
      - feature/windows-toast-notifications-design-20261103

permissions:
  contents: read

jobs:
  win-toast-beta:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Notification event policy and Windows XML tests
        run: cargo test --locked -p tether-notifications --features dev-beta

      - name: Source-boundary regressions
        run: node --test tests/release/windows-notification-event-source.test.mjs tests/release/windows-toast-icons.test.mjs

      - name: Authenticated and rejected WebSocket upgrade integration tests
        run: cargo test --locked -p tetherd --features developer-beta-notification-feed --bin tetherd relay_ws::notification_feed_contract_tests -- --nocapture

      - name: Developer-beta JSON arguments-file compatibility tests
        run: cargo test --locked -p tetherd --features developer-beta-notification-feed --bin tetherd beta_arguments_file::tests -- --nocapture

      - name: Agent feature strict lint
        run: cargo clippy --locked -p tetherd --features developer-beta-notification-feed --all-targets -- -D warnings

      - name: Native beta toast executable
        run: cargo build --locked --release -p tether-notifications --features dev-beta --bin tetherplane-toast-smoke

      - name: Optional beta agent binary for synthetic loopback tests
        run: cargo build --locked --release -p tetherd --features developer-beta-notification-feed

      - name: Build isolated GUI-subsystem parity candidate (never install)
        shell: pwsh
        run: |
          $release = "target/release"
          Copy-Item -LiteralPath "$release/tetherd.exe" -Destination "$release/tetherd-console-preserved.exe"
          cargo build --locked --release -p tetherd --features developer-beta-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI beta compile failed" }
          Move-Item -LiteralPath "$release/tetherd.exe" -Destination "$release/tetherd-agentw-beta.exe"
          Copy-Item -LiteralPath "$release/tetherd-console-preserved.exe" -Destination "$release/tetherd.exe"
          Remove-Item -LiteralPath "$release/tetherd-console-preserved.exe"
          foreach ($probe in @(
            @{File="$release/tetherd.exe"; Subsystem=3},
            @{File="$release/tetherd-agentw-beta.exe"; Subsystem=2}
          )) {
            $bytes=[IO.File]::ReadAllBytes((Resolve-Path $probe.File))
            $pe=[BitConverter]::ToInt32($bytes,0x3C)
            if ($pe -lt 64 -or $pe + 94 -gt $bytes.Length) { throw "Invalid PE header" }
            $subsystem=[BitConverter]::ToUInt16($bytes,($pe+24+68))
            if ($subsystem -ne $probe.Subsystem) { throw "Unexpected Windows subsystem for $($probe.File): $subsystem" }
            Write-Output "SUBSYSTEM_VERIFIED file=$($probe.File) subsystem=$subsystem"
          }
          $badArgumentFile = Join-Path $pwd.Path "nonexistent-public-synthetic-argfile.json"
          if (Test-Path -LiteralPath $badArgumentFile) { throw "Synthetic path unexpectedly exists" }
          $probe=Start-Process -FilePath "$release/tetherd-agentw-beta.exe" -ArgumentList @("--arguments-file", ('"' + $badArgumentFile + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($probe.ExitCode -ne 2) { throw "GUI beta failed to reject absent synthetic arguments file" }
          Write-Output "GUI_BETA_INVALID_SYNTHETIC_ARGUMENTS_REJECTED"

      - name: SHA-256 build evidence
        shell: pwsh
        run: |
          $exe = "target/release/tetherplane-toast-smoke.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Beta executable missing" }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "commit=$env:GITHUB_SHA" | Set-Content -LiteralPath "toast-beta-build-evidence.txt"
          "sha256=$sha" | Add-Content -LiteralPath "toast-beta-build-evidence.txt"
          "artifact=tetherplane-toast-smoke.exe" | Add-Content -LiteralPath "toast-beta-build-evidence.txt"
          $agent = (Get-FileHash -LiteralPath "target/release/tetherd.exe" -Algorithm SHA256).Hash
          "agent_sha256=$agent" | Add-Content -LiteralPath "toast-beta-build-evidence.txt"
          $gui = (Get-FileHash -LiteralPath "target/release/tetherd-agentw-beta.exe" -Algorithm SHA256).Hash
          "gui_agent_sha256=$gui" | Add-Content -LiteralPath "toast-beta-build-evidence.txt"
          Get-Content "toast-beta-build-evidence.txt"

      - name: Package pinned developer-beta kit
        shell: pwsh
        run: |
          $archive = Join-Path $pwd.Path "tetherplane-toast-developer-beta.zip"
          ./scripts/windows/Build-TetherplaneToastBetaKit.ps1 -ArtifactDirectory $pwd.Path -OutputZip $archive -ExpectedCommit $env:GITHUB_SHA
          if (-not (Test-Path -LiteralPath $archive)) { throw "Beta test kit missing" }

      - name: Save private developer-test executable
        uses: actions/upload-artifact@v4
        with:
          name: tetherplane-toast-beta-windows-x64
          path: |
            target/release/tetherplane-toast-smoke.exe
            target/release/tetherd.exe
            target/release/tetherd-agentw-beta.exe
            toast-beta-build-evidence.txt
            tetherplane-toast-developer-beta.zip
          retention-days: 7
          if-no-files-found: error
