name: Vaulter bounded relay supervisor contract
on:
  push:
    paths:
      - "scripts/vaulter-relay-bounded-supervisor.ps1"
      - "tests/release/vaulter-relay-bounded-supervisor-contract.ps1"
      - "scripts/vaulter-relay-supervisor-handover.ps1"
      - "tests/release/vaulter-relay-supervisor-handover-contract.ps1"
      - "scripts/vaulter-relay-supervised-rehearsal.ps1"
      - "tests/release/vaulter-relay-supervised-rehearsal-contract.ps1"
      - "scripts/vaulter-relay-supervised-bridge-child.ps1"
      - "tests/release/vaulter-relay-supervised-bridge-child-contract.ps1"
      - "tests/release/vaulter-relay-bridge-helper-integrity-contract.ps1"
      - ".github/workflows/vaulter-relay-bounded-supervisor.yml"
  pull_request:
    paths:
      - "scripts/vaulter-relay-bounded-supervisor.ps1"
      - "tests/release/vaulter-relay-bounded-supervisor-contract.ps1"
      - "scripts/vaulter-relay-supervisor-handover.ps1"
      - "tests/release/vaulter-relay-supervisor-handover-contract.ps1"
      - "scripts/vaulter-relay-supervised-rehearsal.ps1"
      - "tests/release/vaulter-relay-supervised-rehearsal-contract.ps1"
      - "scripts/vaulter-relay-supervised-bridge-child.ps1"
      - "tests/release/vaulter-relay-supervised-bridge-child-contract.ps1"
      - "tests/release/vaulter-relay-bridge-helper-integrity-contract.ps1"
      - ".github/workflows/vaulter-relay-bounded-supervisor.yml"
jobs:
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bounded supervisor and isolated child test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-bounded-supervisor-contract.ps1
      - name: Guarded supervisor handover (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-supervisor-handover-contract.ps1
      - name: Guarded supervisor handover (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-supervisor-handover-contract.ps1
      - name: Bounded supervisor and isolated child test (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-bounded-supervisor-contract.ps1
      - name: Supervised recovery and rollback contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-supervised-rehearsal-contract.ps1
      - name: Supervised recovery and rollback contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-supervised-rehearsal-contract.ps1
      - name: Supervised bridge child (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-supervised-bridge-child-contract.ps1
      - name: Supervised bridge child (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-supervised-bridge-child-contract.ps1
      - name: Bridge helper pre-source integrity (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-bridge-helper-integrity-contract.ps1
      - name: Bridge helper pre-source integrity (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-bridge-helper-integrity-contract.ps1
