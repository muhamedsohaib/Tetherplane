name: Vaulter bounded relay supervisor contract
on:
  push:
    paths:
      - "scripts/vaulter-relay-bounded-supervisor.ps1"
      - "tests/release/vaulter-relay-bounded-supervisor-contract.ps1"
      - ".github/workflows/vaulter-relay-bounded-supervisor.yml"
  pull_request:
    paths:
      - "scripts/vaulter-relay-bounded-supervisor.ps1"
      - "tests/release/vaulter-relay-bounded-supervisor-contract.ps1"
      - ".github/workflows/vaulter-relay-bounded-supervisor.yml"
jobs:
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bounded supervisor and isolated child test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-bounded-supervisor-contract.ps1
      - name: Bounded supervisor and isolated child test (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-bounded-supervisor-contract.ps1
