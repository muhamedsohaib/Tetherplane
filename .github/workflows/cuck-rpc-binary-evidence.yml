name: CUCK exact-source Windows binary evidence (draft only)

on:
  pull_request:
    branches:
      - fix/cuck-act-rpc-deadline-4b784ec-20261114
    paths:
      - .github/workflows/cuck-rpc-binary-evidence.yml

permissions:
  contents: read

jobs:
  isolated-windowless-binary:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact CUCK fix commit, not pull-request merge head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9cd0af5fa0b1de366641605091bf7882bad8e257
          persist-credentials: false

      - name: Verify exact source and reviewed Rust blob identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cne '9cd0af5fa0b1de366641605091bf7882bad8e257') {
            throw 'REVIEW_SOURCE_NOT_EXACT_CUCK_FIX'
          }
          $provider = (& git hash-object agent/providers/browser/src/lib.rs).Trim()
          $tests = (& git hash-object agent/providers/browser/tests/snapshot_timeout_budget.rs).Trim()
          if ($provider -cne '372cd491396f7b45f88622542fdb90d00d7c753c' -or
              $tests -cne 'dd212dc05d6db251e1153032401969b47fc572aa') {
            throw 'REVIEWED_RUST_FILE_IDENTITY_CHANGED'
          }
          Write-Output 'EXACT_CUCK_FIX_SOURCE_AND_BLOBS_VERIFIED'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Focused browser RPC action regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cargo test --locked -p tether-browser-provider --test snapshot_timeout_budget
          if ($LASTEXITCODE -ne 0) { throw 'CUCK_ACTION_TIMEOUT_REGRESSION_FAILED' }

      - name: Build real Windows release binaries with canonical script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-windows-agent-binaries.ps1
          if ($LASTEXITCODE -ne 0) { throw 'EXACT_CUCK_WINDOWS_RELEASE_BUILD_FAILED' }

      - name: Write byte-verifiable private-review-only receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = '9cd0af5fa0b1de366641605091bf7882bad8e257'
          $binary = 'target/release/tetherd-agentw.exe'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'REVIEW_BINARY_MISSING' }
          $fs = [System.IO.File]::OpenRead((Resolve-Path -LiteralPath $binary).Path)
          try {
            $reader = [System.IO.BinaryReader]::new($fs)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'REVIEW_BINARY_NOT_MZ' }
            $fs.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset -gt $fs.Length - 100) { throw 'INVALID_PE_OFFSET' }
            $fs.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'INVALID_PE_SIGNATURE' }
            $fs.Position = $peOffset + 24 + 0x44
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) { throw "AGENT_NOT_WINDOWLESS_PE_SUBSYSTEM_$subsystem" }
          }
          finally { $fs.Dispose() }
          $dest = 'cuck-review-artifact'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $dest 'tetherd-agentw.exe')
          $built = Join-Path $dest 'tetherd-agentw.exe'
          $receipt = [ordered]@{
            review_only = $true
            signed_release = $false
            public_distribution = 'NO_GO'
            source_commit = $source
            rust_provider_blob_sha1 = '372cd491396f7b45f88622542fdb90d00d7c753c'
            rust_test_blob_sha1 = 'dd212dc05d6db251e1153032401969b47fc572aa'
            binary_filename = 'tetherd-agentw.exe'
            binary_sha256 = (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash.ToLowerInvariant()
            binary_size_bytes = (Get-Item -LiteralPath $built).Length
            binary_pe_subsystem = 2
            authenticode = [string](Get-AuthenticodeSignature -LiteralPath $built).Status
            test_command = 'cargo test --locked -p tether-browser-provider --test snapshot_timeout_budget'
            build_command = './scripts/build-windows-agent-binaries.ps1'
            runner_os = $env:RUNNER_OS
            built_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path -LiteralPath $dest).Path 'CUCK-review-evidence.json'),
            ($receipt | ConvertTo-Json -Depth 5),
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Output ('CUCK_EXACT_BINARY_SHA256=' + $receipt.binary_sha256)
          Write-Output ('CUCK_BINARY_SIZE_BYTES=' + $receipt.binary_size_bytes)
          Write-Output 'CUCK_REVIEW_ONLY_NOT_RELEASE_SIGNED'

      - name: Upload review binary and integrity receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CUCK-action-RPC-review-only-9cd0af5
          path: cuck-review-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
