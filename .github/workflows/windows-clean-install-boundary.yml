name: Windows clean-install boundary (nonrelease)

# Test-only: no production identity, no signing, no OAuth, no package upload.
on:
  pull_request:
    paths:
      - ".github/workflows/windows-clean-install-boundary.yml"
      - "tests/release/windows-clean-install-boundary.ps1"
      - "tests/release/windows-clean-install-boundary-contract.test.mjs"
      - "scripts/install-windows.ps1"
      - "packaging/windows/tetherplane-mcp.ps1"

permissions:
  contents: read

jobs:
  clean-install-boundary:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'test/windows-clean-install-boundary-') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Source and nonrelease policy contracts
        run: node --test tests/release/windows-clean-install-boundary-contract.test.mjs
      - name: Synthetic fresh-install and fail-closed preservation (disposable Windows only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -NonInteractive -File ./tests/release/windows-clean-install-boundary.ps1 -ReportPath (Join-Path $env:RUNNER_TEMP 'tetherplane-clean-install-boundary-report.json')
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_CLEAN_INSTALL_BOUNDARY_NO_GO: $LASTEXITCODE" }
      - name: Upload data-only boundary report (no binary, logs or credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-clean-install-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tetherplane-clean-install-boundary-report.json
          if-no-files-found: warn
          retention-days: 7
