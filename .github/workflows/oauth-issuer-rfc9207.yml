name: TetherAuth scoped OAuth regression

on:
  push:
    branches:
      - test/oauth-issuer-rfc9207-20261020
  pull_request:
    paths:
      - auth/src/provider.ts
      - auth/src/config.ts
      - auth/src/interaction.ts
      - auth/test/oauth-issuer-rfc9207.test.ts
      - auth/test/consent-resource-bound.test.ts
      - .github/workflows/oauth-issuer-rfc9207.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-issuer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.34.5 --activate
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test real oidc-provider issuer response using synthetic local client
        run: pnpm --dir auth exec node --test test/consent-resource-bound.test.ts test/oauth-issuer-rfc9207.test.ts
      - name: Full authentication test suite
        run: pnpm --dir auth test
      - name: Relay tests including unauthorized-operation denials
        run: pnpm --dir relay test
      - name: Workspace TypeScript typecheck
        run: pnpm -r typecheck
