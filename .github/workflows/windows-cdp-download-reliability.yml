name: Windows CDP download reliability

# A focused, independent regression for the observed Windows-only
# Browser.downloadProgress completion timeout in the B6 CDP browser path.
# Each attempt launches a fresh, disposable Chromium profile and local lab.
# No live user browser, human tab, OAuth token or device is involved.
on:
  pull_request:
    paths:
      - "browser/bridge/**"
      - "fixtures/browser-lab/**"
      - "scripts/measure-windows-cdp-startup.ps1"
      - ".github/workflows/windows-cdp-download-reliability.yml"

permissions:
  contents: read

jobs:
  windows-cdp-download:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned workspace toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack enable failed' }
          corepack prepare pnpm@10.34.5 --activate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pnpm activation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen lockfile installation failed' }
      - name: Five fresh Chromium download trials — bounded failure and owned process cleanup
        shell: pwsh
        run: ./scripts/measure-windows-cdp-startup.ps1 -EvidenceDirectory '${{ runner.temp }}/cdp-startup'
      - name: Retain sanitized startup receipts, including failed trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cdp-startup-${{ github.sha }}
          path: ${{ runner.temp }}/cdp-startup/cdp-startup-trial-*.jsonl
          if-no-files-found: error
          retention-days: 14

  startup-contention:
    name: Startup only (${{ matrix.parallelism }} concurrent)
    strategy:
      fail-fast: false
      matrix:
        parallelism: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'Corepack enable failed' }
          corepack prepare pnpm@10.34.5 --activate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pnpm activation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen workspace install failed' }
      - name: Five startup-only trials, with a fresh process and profiles each time
        shell: pwsh
        run: ./scripts/measure-windows-cdp-startup.ps1 -Scenario startup -Parallelism ${{ matrix.parallelism }} -EvidenceDirectory '${{ runner.temp }}/startup-probe'
      - name: Retain sanitized contention probe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-contention-${{ github.sha }}-${{ matrix.parallelism }}
          path: ${{ runner.temp }}/startup-probe/cdp-startup-trial-*.jsonl
          if-no-files-found: error
          retention-days: 14
