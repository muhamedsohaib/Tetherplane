name: Codex Phase 1 functional contract (NO RELEASE)

on:
  pull_request:
    paths:
      - 'scripts/release/phase1-codex-acceptance.mjs'
      - 'tests/release/phase1-codex-acceptance.test.mjs'
      - '.github/workflows/phase1-codex-acceptance-contract.yml'
  push:
    branches:
      - 'feature/codex-repeatable-acceptance-20261021'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax verification
        run: node --check scripts/release/phase1-codex-acceptance.mjs
      - name: Test accepted and forbidden scenarios
        run: node --test tests/release/phase1-codex-acceptance.test.mjs
      - name: Assert synthetic-only boundary
        run: echo 'No credentials, live model calls, device installation, user config writes, signing or publication.'
