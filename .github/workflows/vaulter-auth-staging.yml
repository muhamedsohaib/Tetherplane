name: Vaulter auth staging verification

on:
  push:
    paths:
      - ".github/workflows/vaulter-auth-staging.yml"
      - "scripts/vaulter-tether-auth-*.mjs"
      - "scripts/vaulter-tether-auth-*.ps1"
      - "tests/release/vaulter-tether-auth-*"
      - "auth/test/production.test.ts"
      - "auth/src/runtime.ts"
  pull_request:
    paths:
      - ".github/workflows/vaulter-auth-staging.yml"
      - "scripts/vaulter-tether-auth-*.mjs"
      - "scripts/vaulter-tether-auth-*.ps1"
      - "tests/release/vaulter-tether-auth-*"
      - "auth/test/production.test.ts"
      - "auth/src/runtime.ts"

jobs:
  stage-check:
    name: staging contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Key material tests
        run: node --test tests/release/vaulter-tether-auth-material.test.mjs
      - name: PowerShell syntax and stage safety checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-stage-contract.ps1
      - name: Real relay pretest with competing pnpm on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-nested-pnpm-integration.ps1
      - name: Vaulter OAuth route preflight contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-route-preflight-contract.ps1
      - name: Reversible Funnel JWKS canary contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-funnel-canary-contract.ps1
      - name: Read-only cutover readiness contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-cutover-readiness-contract.ps1
      - name: Read-only cutover readiness on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-cutover-readiness-contract.ps1
      - name: Read-only task supervision contract in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-supervision-contract.ps1
      - name: Read-only task supervision contract in PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-supervision-contract.ps1
      - name: S4U startup registration safety contracts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-autostart-contract.ps1
      - name: S4U startup registration safety contracts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-autostart-contract.ps1
      - name: Staged auth activation rollback contracts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-activation-contract.ps1
      - name: Staged auth activation rollback contracts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-activation-contract.ps1
      - name: Supervised auth postcheck contract (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-supervised-postcheck-contract.ps1
      - name: Supervised auth postcheck contract (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-supervised-postcheck-contract.ps1
