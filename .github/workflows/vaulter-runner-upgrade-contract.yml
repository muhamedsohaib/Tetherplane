name: Vaulter protected runner contract

on:
  push:
    paths:
      - ".github/workflows/vaulter-runner-upgrade-contract.yml"
      - "scripts/vaulter-tether-auth-runner-integrity.ps1"
      - "scripts/vaulter-tether-auth-runner-upgrade.ps1"
      - "scripts/vaulter-tether-auth-offline-restore.ps1"
      - "scripts/vaulter-tether-auth-autostart.ps1"
      - "scripts/vaulter-tether-auth-supervised-postcheck.ps1"
      - "scripts/vaulter-tether-auth-recovery-rehearsal.ps1"
      - "tests/release/vaulter-tether-auth-runner-upgrade-contract.ps1"
      - "tests/release/vaulter-tether-auth-offline-restore-contract.ps1"
      - "tests/release/vaulter-tether-auth-recovery-contract.ps1"
      - "scripts/vaulter-tether-auth-staged-cutback.ps1"
      - "tests/release/vaulter-tether-auth-staged-cutback-contract.ps1"
      - "tests/release/vaulter-tether-auth-autostart-contract.ps1"
  pull_request:
    paths:
      - ".github/workflows/vaulter-runner-upgrade-contract.yml"
      - "scripts/vaulter-tether-auth-runner-integrity.ps1"
      - "scripts/vaulter-tether-auth-runner-upgrade.ps1"
      - "scripts/vaulter-tether-auth-offline-restore.ps1"
      - "scripts/vaulter-tether-auth-autostart.ps1"
      - "scripts/vaulter-tether-auth-supervised-postcheck.ps1"
      - "scripts/vaulter-tether-auth-recovery-rehearsal.ps1"
      - "tests/release/vaulter-tether-auth-runner-upgrade-contract.ps1"
      - "tests/release/vaulter-tether-auth-offline-restore-contract.ps1"
      - "tests/release/vaulter-tether-auth-recovery-contract.ps1"

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing S4U registrar and v2 probe contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-autostart-contract.ps1
      - name: Existing S4U registrar and v2 probe contract (PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-autostart-contract.ps1
      - name: Offline v1 recovery contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-offline-restore-contract.ps1
      - name: Offline v1 recovery contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-offline-restore-contract.ps1
      - name: Guarded supervisor refresh and v1 recovery contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-recovery-contract.ps1
      - name: Guarded supervisor refresh and v1 recovery contract (PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-recovery-contract.ps1
      - name: Ownership-verified staged cutback (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-staged-cutback-contract.ps1
      - name: Ownership-verified staged cutback (PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-staged-cutback-contract.ps1
      - name: Exact runner hash and atomic upgrade contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-tether-auth-runner-upgrade-contract.ps1
      - name: Exact runner hash and atomic upgrade contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-tether-auth-runner-upgrade-contract.ps1
