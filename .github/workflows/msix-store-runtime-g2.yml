name: MSIX Store runtime G2 (nonrelease)

# Disposable Windows feasibility. Never publishes or deploys to owner devices.
on:
  pull_request:
    paths:
      - ".github/workflows/msix-store-runtime-g2.yml"
      - "packaging/msix-store-runtime/**"
      - "scripts/msix-store/**"
      - "tests/release/msix-store-runtime*.mjs"
      - "docs/release/MSIX_STORE_RUNTIME_G2_20261027.md"

permissions:
  contents: read

jobs:
  onboarding-unit:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/msix-store-runtime-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: First-run credential/authorization and MSIX source contracts
        run: node --test tests/release/msix-store-runtime.test.mjs tests/release/msix-store-runtime-contract.test.mjs

  windows-runtime-package:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/msix-store-runtime-') }}
    needs: onboarding-unit
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Ensure package is a disposable development probe
        run: node --test tests/release/msix-store-runtime.test.mjs tests/release/msix-store-runtime-contract.test.mjs
      - name: Validate signed Node runtime and licensing before packaging
        shell: pwsh
        run: |
          $nodeExe = node -p "process.execPath"
          if (-not (Test-Path -LiteralPath $nodeExe -PathType Leaf)) { throw "Node binary unavailable" }
          $signature = Get-AuthenticodeSignature -FilePath $nodeExe
          if ([string]$signature.Status -ne "Valid") { throw "Bundled Node runtime lacks a trusted signature" }
          if (-not (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $nodeExe) "LICENSE"))) { throw "Node runtime license missing" }
      - name: Verify Windows SDK and certificate provider before expensive compilation
        run: node scripts/msix-store/ci-prerequisites.mjs
      - name: Enable pinned pnpm workspace dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm install --frozen-lockfile
          pnpm -r build
      - name: Create isolated production Compact MCP dependency tree
        shell: pwsh
        run: |
          $deploy = Join-Path $env:RUNNER_TEMP "msix-runtime-deploy\compact-mcp"
          pnpm --config.node-linker=hoisted --filter @tetherplane/compact-mcp deploy --legacy --prod $deploy
          if ($LASTEXITCODE -ne 0) { throw "Compact MCP deployment failed" }
      - name: Compile exact-source native agent
        run: cargo build --release --locked -p tetherd
      - name: Bounded Store-runtime MSIX package, signature and add/remove test
        run: node scripts/msix-store/run-bounded-runtime-probe.mjs
      - name: Upload only JSON evidence (never app, executable or keys)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msix-store-runtime-g2-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tetherplane-msix-runtime-g2-report.json
          if-no-files-found: warn
          retention-days: 7
