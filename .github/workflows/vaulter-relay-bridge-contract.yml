name: Vaulter relay bridge launcher contract
on:
  push:
    paths:
      - "scripts/vaulter-relay-bridge-launcher.ps1"
      - "tests/release/vaulter-relay-bridge-launcher-contract.ps1"
      - ".github/workflows/vaulter-relay-bridge-contract.yml"
      - "tests/release/vaulter-relay-bridge-native-contract.ps1"
      - "tests/release/vaulter-relay-supervised-parent-contract.ps1"
  pull_request:
    paths:
      - "scripts/vaulter-relay-bridge-launcher.ps1"
      - "tests/release/vaulter-relay-bridge-launcher-contract.ps1"
      - ".github/workflows/vaulter-relay-bridge-contract.yml"
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/release/vaulter-relay-bridge-launcher-contract.ps1
      - name: Contract in PowerShell 7
        shell: pwsh
        run: ./tests/release/vaulter-relay-bridge-launcher-contract.ps1
      - name: Native CLI config contract in PowerShell 5.1
        shell: powershell
        run: ./tests/release/vaulter-relay-bridge-native-contract.ps1
      - name: Native CLI config contract in PowerShell 7
        shell: pwsh
        run: ./tests/release/vaulter-relay-bridge-native-contract.ps1
      - name: Supervised parent contract (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/release/vaulter-relay-supervised-parent-contract.ps1
      - name: Supervised parent contract (PowerShell 7)
        shell: pwsh
        run: ./tests/release/vaulter-relay-supervised-parent-contract.ps1
