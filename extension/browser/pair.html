<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tetherplane Pairing</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 12px; }
    input { box-sizing: border-box; width: 100%; padding: 7px; }
    button { padding: 8px 10px; }
    #status { min-height: 18px; font-size: 12px; }
  </style>
</head>
<body>
  <form id="pair-form">
    <label>
      Loopback bridge URL
      <input id="bridge-url" name="bridge_url" type="url" value="ws://127.0.0.1:8123/extension" autocomplete="off" required>
    </label>
    <label>
      Ephemeral launch token
      <input id="launch-token" name="launch_token" type="password" autocomplete="off" required>
    </label>
    <button type="submit">Pair</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <script type="module" src="dist/pair.js"></script>
</body>
</html>
